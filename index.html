<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="var(--theme-color)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Mapp</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- 默认及三种 Esri 底图共用同一图源；提前完成连接建立，缩短首批瓦片等待。 -->
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <!-- OSM 是可选底图，仅预解析其分片域名，不额外占用长连接。 -->
    <link rel="dns-prefetch" href="//a.tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="//b.tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="//c.tile.openstreetmap.org" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <style>
       /* Theme Color CSS Variables */
       :root {
         --theme-color: #FFDD00;
         --theme-color-dark: #E6C700;
       }
       
       /* 禁止双击缩放；不在全局开放 pan，避免整页小幅滚动（地图/看板自行覆盖） */
       * {
         touch-action: manipulation;
       }
       
       html, body {
         height: 100%;
         height: 100dvh;
         max-height: 100dvh;
         overflow: hidden;
         overscroll-behavior: none;
         -webkit-text-size-adjust: 100%;
         -ms-touch-action: manipulation;
         touch-action: manipulation;
         background-color: var(--theme-color);
       }

       #root {
         height: 100%;
         max-height: 100dvh;
         overflow: hidden;
         background-color: var(--theme-color);
       }
       
       /* Custom scrollbar for better aesthetics */
       ::-webkit-scrollbar {
         width: 6px;
         height: 6px;
       }
       ::-webkit-scrollbar-track {
         background: transparent;
       }
       ::-webkit-scrollbar-thumb {
         background: var(--theme-color); 
         border-radius: 3px;
       }
       ::-webkit-scrollbar-thumb:hover {
         background: var(--theme-color-dark);
       }
       /* Leaflet fix for z-index issues in some frameworks */
       .leaflet-pane { z-index: 10; }
       .leaflet-bottom { z-index: 20; }
       .leaflet-top { z-index: 20; }

       /* Disable default touch actions for better app-like feel */
       .leaflet-container,
       #board-view-container,
       #graph-view-container,
       .workspace-canvas--graph,
       [data-mapp-canvas-pinch] {
         -webkit-touch-callout: none !important;
         -webkit-user-select: none !important;
         user-select: none !important;
         touch-action: none;
       }

       /*
        * Chrome 窗口 / 浮层：禁止浏览器把双指当成整页缩放。
        * 可滚动区域单独放开纵向平移，避免设置面板等无法滑动。
        */
       [data-chrome-window-surface],
       [data-compact-window-backdrop],
       [data-mapp-chrome-ui],
       [data-mapp-export-ui],
       .ui-workspace-bottom-bar {
         touch-action: none;
       }
       [data-chrome-window-surface] .overflow-y-auto,
       [data-chrome-window-surface] .overflow-auto,
       [data-chrome-window-surface] .overflow-y-scroll,
       [data-chrome-window-surface] [data-chrome-scroll],
       [data-mapp-chrome-ui].overflow-y-auto,
       [data-mapp-chrome-ui] .overflow-y-auto,
       [data-mapp-chrome-ui] .overflow-auto {
         touch-action: pan-y;
       }

       /* Global disable for mobile browser long-press interactions */
       * {
         -webkit-touch-callout: none !important;
         -webkit-user-select: none !important;
         -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
         -webkit-tap-highlight-color: transparent !important;
         user-select: none !important;
       }

       /* Allow text selection in input fields and textareas */
       input, textarea, [contenteditable="true"] {
         -webkit-user-select: text !important;
         user-select: text !important;
       }

       /* 详情预览卡：允许鼠标选中正文与标题 */
       .mapping-preview-selectable,
       .mapping-preview-selectable * {
         -webkit-user-select: text !important;
         user-select: text !important;
       }
       .mapping-preview-selectable button,
       .mapping-preview-selectable button * {
         -webkit-user-select: none !important;
         user-select: none !important;
       }

       /* Disable context menu on right-click/long-press */
       * {
         -webkit-context-menu: none !important;
         context-menu: none !important;
       }
     </style>
     <link rel="stylesheet" href="./index.css">
</head>
<body class="text-gray-800 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
